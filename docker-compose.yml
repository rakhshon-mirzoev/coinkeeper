services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: coinkeeper
      POSTGRES_PASSWORD: coinkeeper
      POSTGRES_DB: coinkeeper
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coinkeeper -d coinkeeper"]
      interval: 5s
      timeout: 3s
      retries: 3

  migrate:
    build:
      context: .
      target: migrate
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://coinkeeper:coinkeeper@postgres:5432/coinkeeper?sslmode=disable
      GOOSE_MIGRATION_DIR: /migrations
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      args:
        APP: api
    env_file: .env
    environment:
      DATABASE_URL: postgres://coinkeeper:coinkeeper@postgres:5432/coinkeeper?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  bot:
    build:
      context: .
      args:
        APP: bot
    env_file: .env
    environment:
      DATABASE_URL: postgres://coinkeeper:coinkeeper@postgres:5432/coinkeeper?sslmode=disable
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
